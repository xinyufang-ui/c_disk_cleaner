name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --name "C盘清理工具" --icon=NONE c_disk_cleaner.py
      - uses: actions/upload-artifact@v4
        with:
          name: C盘清理工具
          path: dist/*.exe
